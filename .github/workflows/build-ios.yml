                      name: UIResponder.keyboardWillHideNotification, object: nil
                  )
              }

              @objc private func blurWebInputOnKeyboardDismissal() {
                  // 系统“完成”只收起键盘，DOM 焦点仍可能保留；先失焦，避免视口恢复时追踪光标。
                  realtimeWebView?.evaluateJavaScript("""
                  (() => {
