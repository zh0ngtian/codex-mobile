              func installBoldTextSupport(_ webView: WKWebView) {
                  let script = WKUserScript(
                      source: boldTextScript,
                      injectionTime: .atDocumentEnd, forMainFrameOnly: true
                  )
                  webView.configuration.userContentController.addUserScript(script)
                  NotificationCenter.default.addObserver(
                      self, selector: #selector(syncBoldText),
                      name: UIAccessibility.boldTextStatusDidChangeNotification, object: nil
                  )
                  NotificationCenter.default.addObserver(
                      self, selector: #selector(syncBoldText),
                      name: UIApplication.didBecomeActiveNotification, object: nil
                  )
              }

              @objc func syncBoldText() {
                  realtimeWebView?.evaluateJavaScript(boldTextScript, completionHandler: nil)
              }
          }
