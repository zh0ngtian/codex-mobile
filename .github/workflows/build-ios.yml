      - name: Generate AppIcon
        working-directory: pakeplus
        shell: bash
        run: |
          set -euo pipefail
          brew install Nonchalant/appicon/appicon
          appicon app-icon.png \
            --output-path PakePlus/Assets.xcassets/AppIcon.appiconset

      - name: Build unsigned iOS app
        working-directory: pakeplus
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project PakePlus.xcodeproj \
            -scheme PakePlus \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Prepare and verify unsigned IPA
        working-directory: pakeplus
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/PakePlus.app"
          package="$RUNNER_TEMP/ipa"
          artifact="$RUNNER_TEMP/CodexMobile-v${APP_VERSION}-unsigned.ipa"
          listing="$RUNNER_TEMP/CodexMobile-ios-contents.txt"
          unpacked="$RUNNER_TEMP/CodexMobile-ios-unpacked"
          test -d "$app"
          test -s "$app/index.html"
          python3 - "$app/Info.plist" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          info = plistlib.loads(Path(sys.argv[1]).read_bytes())
          for key in ("UISupportedInterfaceOrientations", "UISupportedInterfaceOrientations~ipad"):
              if info.get(key) != ["UIInterfaceOrientationPortrait"]:
                  raise SystemExit(f"Final iOS app must be portrait-only: {key}")
          if info.get("UIRequiresFullScreen") is not True:
              raise SystemExit("Final iOS app must require full screen for portrait lock")
          PY
          find "$app" -maxdepth 1 -type f -name 'index-*.js' -print -quit \
            | grep -q .
          test "$(/usr/libexec/PlistBuddy -c 'Print :DEBUG' \
            "$app/Info.plist")" = "false"
          test -n "$(/usr/libexec/PlistBuddy \
            -c 'Print :NSCameraUsageDescription' "$app/Info.plist")"
          test -n "$(/usr/libexec/PlistBuddy \
            -c 'Print :NSMicrophoneUsageDescription' "$app/Info.plist")"
          test -n "$(/usr/libexec/PlistBuddy \
            -c 'Print :NSLocationWhenInUseUsageDescription' \
            "$app/Info.plist")"
          test "$(/usr/libexec/PlistBuddy \
            -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' \
            "$app/Info.plist")" = "true"
          if /usr/libexec/PlistBuddy \
            -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' \
            "$app/Info.plist" >/dev/null 2>&1; then
            echo "::error::Final iOS app still allows arbitrary network loads"
            exit 1
          fi
          for key in ':UIBackgroundModes'; do
            if /usr/libexec/PlistBuddy -c "Print $key" \
              "$app/Info.plist" >/dev/null 2>&1; then
              echo "::error::Final iOS app contains unnecessary key $key"
              exit 1
            fi
          done
          mkdir -p "$package/Payload"
          cp -R "$app" "$package/Payload/"
          (
            cd "$package"
            zip -qry "$artifact" Payload
          )
          test -s "$artifact"
          unzip -l "$artifact" > "$listing"
          grep -Fq 'Payload/PakePlus.app/index.html' "$listing"
          grep -Eq 'Payload/PakePlus.app/index-.+\.js' "$listing"
          unzip -q "$artifact" -d "$unpacked"
          node "$RUNNER_TEMP/scan-mobile-assets.cjs" \
            "$unpacked/Payload/PakePlus.app"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 "CodexMobile-v${APP_VERSION}-unsigned.ipa" \
              > "CodexMobile-v${APP_VERSION}-unsigned.ipa.sha256"
          )
          cat "$artifact.sha256"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodexMobile-ios-unsigned
          path: |
            ${{ runner.temp }}/CodexMobile-v${{ env.APP_VERSION }}-unsigned.ipa
            ${{ runner.temp }}/CodexMobile-v${{ env.APP_VERSION }}-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
