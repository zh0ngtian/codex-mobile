name: Build iOS App

on:
  workflow_call:
    inputs:
      app_version:
        description: Version shared by all release artifacts
        required: true
        type: string
  workflow_dispatch:
    inputs:
      app_version:
        description: Optional version override
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: CodexMobile
  DISPLAY_NAME: Codex Mobile
  APP_ID: vip.loock.codexmobile

jobs:
  build:
    name: Build Codex Mobile iOS
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve app version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-$(node -p "require('./package.json').version")}"
          version="${version#v}"
          node -e '
            const version = process.argv[1];
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Invalid app version: ${version}`);
            }
          ' "$version"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Checkout pinned PakePlus iOS
        uses: actions/checkout@v4
        with:
          repository: Sjj1024/PakePlus-iOS
          ref: 4be7575f47f24e0d8b4be499371da47b7d850ae7
          path: pakeplus
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Codex Mobile app icon
        shell: bash
        run: |
          set -euo pipefail
          icon="docs/assets/app-icon/codex-mobile-app-icon-1024.png"
          test -s "$icon"
          node - "$icon" <<'NODE'
          const fs = require("node:fs");
          const icon = fs.readFileSync(process.argv[2]);
          const png = Buffer.from([137, 80, 78, 71, 13, 10, 26, 10]);
          if (!icon.subarray(0, 8).equals(png)) {
            throw new Error("App icon is not a PNG");
          }
          if (icon.readUInt32BE(16) !== 1024 || icon.readUInt32BE(20) !== 1024) {
            throw new Error("App icon must be 1024x1024");
          }
          NODE
          cp "$icon" pakeplus/app-icon.png
          cmp "$icon" pakeplus/app-icon.png

      - name: Build embedded frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          VITE_APP_VERSION="$APP_VERSION" npm run build
          test -s dist/index.html
          grep -Eq '(src|href)="\./assets/' dist/index.html
          cat > "$RUNNER_TEMP/scan-mobile-assets.cjs" <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const allowedUrlPrefixes = [
            "http://www.apple.com/DTDs/",
            "http://www.w3.org/",
            "https://github.com/remarkjs/",
            "https://github.com/syntax-tree/",
            "https://github.com/loock-ai/codex-mobile/releases/",
            "https://api.github.com/repos/loock-ai/codex-mobile/releases/",
            "https://maps.google.com/",
            "https://react.dev/errors/",
            // Mermaid 及其解析器内置的诊断文档链接，不是运行时后端地址。
            "https://github.com/mermaid-js/mermaid/issues",
            "https://github.com/mermaid-js/mermaid/releases/tag/",
            "https://chevrotain.io/docs/",
            "https://github.com/chevrotain/chevrotain/issues",
            "https://langium.org/docs/reference/configuration-services/",
          ];
          const allowedUrls = new Set([
            "https://api.day.app/DeviceKey",
            "http://host.local:18766/?token=xxx",
            "http://192.168.123.79:8765/channels/codex-mobile/latest.json",
            "http://192.168.123.79:8765/channels/codex-mobile/latest.apk",
            "https://www.pakeplus.com/",
            "https://github.com/markedjs/marked.",
            "https://en.wikipedia.org/wiki/LL_parser#Left_factoring.",
            "http://www.eclipse.org/elk/ElkGraph",
            "http:///org/eclipse/emf/ecore/util/ExtendedMetaData",
            "http://www.eclipse.org/emf/2002/Ecore",
            "http://www.eclipse.org/emf/2003/XMLType",
          ]);
          const endpointPatterns = [
            [
              "private or link-local IPv4",
              /(^|[^0-9])((10|127)\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|169\.254\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})(?=[:/"'\s]|$)/gi,
            ],
            [
              "loopback, unique-local, or link-local IPv6",
              /\[(::1|f[cd][0-9a-f:]*|fe[89ab][0-9a-f:]*)\](?=[:/"'\s]|$)/gi,
            ],
            [
              "localhost",
              /(https?|wss?):\/\/localhost(?=[:/]|$)/gi,
            ],
          ];
          const credentialPatterns = [
            [
              "query credential",
              /[?&](token|access_token|api[_-]?key|secret|password)=[A-Za-z0-9._~+/%=-]{8,}/gi,
            ],
            [
              "assigned credential",
              /["']?(token|authorization|api[_-]?key|secret|password)["']?\s*[:=]\s*["'][^"'\s]{8,}["']/gi,
            ],
            [
              "bearer credential",
              /\bbearer\s+[A-Za-z0-9._~+\/=-]{12,}/gi,
            ],
            [
              "CODEX_MOBILE_TOKEN credential",
              /CODEX_MOBILE_TOKEN\s*=\s*["']?[A-Za-z0-9._~+\/=-]{8,}/g,
            ],
          ];
          const urlPattern = /(?:https?|wss?):\/\/[^\x00-\x20"'`<>\\]+/g;
          const textExtensions = new Set([
            ".css", ".html", ".js", ".json", ".map", ".plist", ".strings",
            ".svg", ".txt", ".xml",
          ]);

          function collect(target) {
            const stat = fs.statSync(target);
            if (stat.isDirectory()) {
              return fs.readdirSync(target).flatMap((entry) =>
                collect(path.join(target, entry))
              );
            }
            return textExtensions.has(path.extname(target).toLowerCase())
              ? [target]
              : [];
          }

          const files = process.argv.slice(2).flatMap(collect);
          if (files.length === 0) {
            throw new Error("No text assets were found to scan");
          }
          const findings = [];
          for (const file of files) {
            const source = fs.readFileSync(file, "utf8");
            const endpointSource = [...allowedUrls].reduce(
              (current, url) => current.replaceAll(url, ""),
              source,
            );
            for (const [label, pattern] of [
              ...endpointPatterns,
              ...credentialPatterns,
            ]) {
              for (const match of endpointSource.matchAll(pattern)) {
                findings.push(`${file}: ${label}: ${match[0].slice(0, 160)}`);
              }
            }
            for (const match of source.matchAll(urlPattern)) {
              const url = match[0];
              if (
                !allowedUrls.has(url)
                && !allowedUrlPrefixes.some((prefix) => url.startsWith(prefix))
              ) {
                findings.push(`${file}: unexpected fixed URL: ${url.slice(0, 160)}`);
              }
            }
          }
          if (findings.length > 0) {
            console.error(findings.join("\n"));
            process.exit(1);
          }
          NODE
          node "$RUNNER_TEMP/scan-mobile-assets.cjs" dist
          cp -R dist/. pakeplus/scripts/www/

      - name: Configure PakePlus for embedded HTML
        working-directory: pakeplus
        shell: bash
        run: |
          set -euo pipefail
          jq \
            --arg name "$APP_NAME" \
            --arg displayName "$DISPLAY_NAME" \
            --arg appid "$APP_ID" \
            --arg version "$APP_VERSION" \
            '
              .name = $name
              | .url = ""
              | .showName = $displayName
              | .appid = $appid
              | .version = $version
              | .desc = "Codex Mobile"
              | .isHtml = true
              | .ios.name = $name
              | .ios.showName = $displayName
              | .ios.id = $appid
              | .ios.version = $version
              | .ios.webUrl = ""
              | .ios.desc = "Codex Mobile"
              | .ios.pubBody = ($displayName + " v" + $version)
              | .ios.isHtml = true
              | .ios.debug = false
              | .phone.camera = true
            ' scripts/ppconfig.json > "$RUNNER_TEMP/ppconfig-ios.json"
          mv "$RUNNER_TEMP/ppconfig-ios.json" scripts/ppconfig.json
          jq -e \
            --arg appid "$APP_ID" \
            --arg version "$APP_VERSION" \
            '
              .ios.id == $appid
              and .ios.version == $version
              and .ios.isHtml == true
              and .ios.webUrl == ""
              and .phone.camera == true
            ' scripts/ppconfig.json > /dev/null

      - name: Install PakePlus dependencies
        working-directory: pakeplus
        run: pnpm install --frozen-lockfile

      - name: Generate iOS project
        working-directory: pakeplus
        run: pnpm pp:worker

      - name: Install iOS in-app browser source
        shell: bash
        run: |
          set -euo pipefail
          source="mobile/ios/InAppBrowserViewController.swift"
          destination="pakeplus/PakePlus/InAppBrowserViewController.swift"
          test -s "$source"
          cp "$source" "$destination"
          cmp "$source" "$destination"
          cp mobile/ios/AttachmentPickerBridge.swift pakeplus/PakePlus/AttachmentPickerBridge.swift
          cmp mobile/ios/AttachmentPickerBridge.swift pakeplus/PakePlus/AttachmentPickerBridge.swift

      - name: Harden and test the iOS host
        working-directory: pakeplus
        shell: bash
        run: |
          set -euo pipefail
          plist="PakePlus/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :DEBUG false" "$plist"
          /usr/libexec/PlistBuddy \
            -c "Delete :NSAppTransportSecurity:NSAllowsArbitraryLoads" \
            "$plist"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" \
            "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :NSCameraUsageDescription string 扫描 Codex Mobile 网关连接二维码" \
            "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy \
              -c "Set :NSCameraUsageDescription 扫描 Codex Mobile 网关连接二维码" \
              "$plist"
          /usr/libexec/PlistBuddy \
            -c "Add :NSMicrophoneUsageDescription string 与 Codex 进行实时语音交互" \
            "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy \
              -c "Set :NSMicrophoneUsageDescription 与 Codex 进行实时语音交互" \
              "$plist"
          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationWhenInUseUsageDescription string 在你选择当前位置时将位置添加到消息" \
            "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy \
              -c "Set :NSLocationWhenInUseUsageDescription 在你选择当前位置时将位置添加到消息" \
              "$plist"
          /usr/libexec/PlistBuddy \
            -c "Delete :NSCameraReactionEffectGesturesEnabledDefault" \
            "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :NSLocalNetworkUsageDescription string 连接用户添加的局域网 Codex 网关" \
            "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy \
              -c "Set :NSLocalNetworkUsageDescription 连接用户添加的局域网 Codex 网关" \
              "$plist"
          /usr/libexec/PlistBuddy \
            -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" \
            "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy \
              -c "Set :NSAppTransportSecurity:NSAllowsLocalNetworking true" \
              "$plist"
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import plistlib

          native_version = os.environ["APP_VERSION"].split("-")[0]
          major, minor, patch = map(int, native_version.split("."))
          build_number = major * 1_000_000 + minor * 1_000 + patch
          project_path = Path("PakePlus.xcodeproj/project.pbxproj")
          project = project_path.read_text()
          for setting, value in (
              ("MARKETING_VERSION", native_version),
              ("CURRENT_PROJECT_VERSION", str(build_number)),
              ("INFOPLIST_KEY_UISupportedInterfaceOrientations", "UIInterfaceOrientationPortrait"),
              ("INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad", "UIInterfaceOrientationPortrait"),
          ):
              project, count = re.subn(
                  rf"{setting} = [^;]+;",
                  f"{setting} = {value};",
                  project,
              )
              if count != 2:
                  raise SystemExit(f"Pinned PakePlus {setting} settings changed")
          project_path.write_text(project)
          plist_path = Path("PakePlus/Info.plist")
          info = plistlib.loads(plist_path.read_bytes())
          info["UIRequiresFullScreen"] = True
          info["CFBundleURLTypes"] = [{
              "CFBundleURLName": "Codex Mobile conversation",
              "CFBundleURLSchemes": ["codexmobile"],
              "CFBundleTypeRole": "Viewer",
          }]
          plist_path.write_bytes(plistlib.dumps(info))

          content_path = Path("PakePlus/ContentView.swift")
          content = content_path.read_text()
          keyboard_safe_area = ".ignoresSafeArea(edges: [.all])\n            .allowsHitTesting"
          if content.count(keyboard_safe_area) != 1:
              raise SystemExit("Pinned PakePlus keyboard safe area hook changed")
          content_path.write_text(content.replace(
              keyboard_safe_area,
              ".ignoresSafeArea(.container, edges: [.all])\n"
              "            .onOpenURL { CodexMobileCompletionRouter.open($0) }\n"
              "            .allowsHitTesting",
              1,
          ))

          path = Path("PakePlus/WebView.swift")
          source = path.read_text()
          viewport_anchor = "meta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';"
          if source.count(viewport_anchor) != 1:
              raise SystemExit("Pinned PakePlus viewport hook changed")
          source = source.replace(
              viewport_anchor,
              "meta.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover';",
              1,
          )
          import_anchor = "import WebKit\n"
          if source.count(import_anchor) != 1:
              raise SystemExit("Pinned PakePlus WebKit import changed")
          source = source.replace(
              import_anchor,
              import_anchor + "import UserNotifications\n",
              1,
          )
          developer_extras = '''        // enable developer extras
                  if #available(iOS 16.4, *) {
                      webConfiguration.preferences.setValue(true, forKey: "developerExtrasEnabled")
                  } else {
                      webConfiguration.preferences.setValue(true, forKey: "developerExtrasEnabled")
                      UserDefaults.standard.set(true, forKey: "WebKitDeveloperExtras")
                  }
          '''
          if developer_extras not in source:
              raise SystemExit("Pinned PakePlus developer extras block changed")
          source = source.replace(developer_extras, "")
          webview_constructor = "let webView = WKWebView(frame: .zero, configuration: webConfiguration)"
          if source.count(webview_constructor) != 1:
              raise SystemExit("Pinned PakePlus WebView constructor changed")
          source = source.replace(
              webview_constructor,
              "let webView = CodexMobileWebView(frame: .zero, configuration: webConfiguration)\n"
              "        CodexMobileAttachmentPickerBridge.configure(webView)",
              1,
          )
          media_prompt = "        decisionHandler(permissionDecisionForMediaCapture(type: type))"
          if media_prompt not in source:
              raise SystemExit("Pinned PakePlus media permission hook changed")
          bridge_registration = (
              '        webView.configuration.userContentController.add('
              'context.coordinator, name: "blobDownload")'
          )
          if source.count(bridge_registration) != 1:
              raise SystemExit("Pinned PakePlus script bridge registration changed")
          source = source.replace(
              bridge_registration,
              bridge_registration
              + '\n        webView.configuration.userContentController.add('
              'context.coordinator, name: "realtimeAudio")'
              + '\n        webView.configuration.userContentController.add('
              'context.coordinator, name: "completionNotification")'
              + '\n        UNUserNotificationCenter.current().delegate = context.coordinator'
              + '\n        context.coordinator.realtimeWebView = webView'
              + '\n        context.coordinator.installBoldTextSupport(webView)'
              + '\n        context.coordinator.installKeyboardDismissalSupport()',
              1,
          )
          coordinator_declaration = (
              "class Coordinator: NSObject, UIScrollViewDelegate, "
              "WKNavigationDelegate, WKUIDelegate, WKScriptMessageHandler, "
              "CLLocationManagerDelegate {"
          )
          if source.count(coordinator_declaration) != 1:
              raise SystemExit("Pinned PakePlus Coordinator declaration changed")
          source = source.replace(
              coordinator_declaration,
              coordinator_declaration[:-2]
              + ", UNUserNotificationCenterDelegate {",
              1,
          )
          coordinator_fields = (
              "    private var locationManager: CLLocationManager?\n"
          )
          if source.count(coordinator_fields) != 1:
              raise SystemExit("Pinned PakePlus Coordinator fields changed")
          source = source.replace(
              coordinator_fields,
              coordinator_fields
              + "    weak var realtimeWebView: WKWebView?\n"
              + "    private var realtimeAudioEngine: AVAudioEngine?\n"
              + "    private var realtimeAudioConverter: AVAudioConverter?\n"
              + "    private var realtimeAudioMuted = false\n",
              1,
          )
          message_handler = (
              "    func userContentController(_ userContentController: "
              "WKUserContentController, didReceive message: WKScriptMessage) {\n"
              '        guard message.name == "blobDownload" else { return }'
          )
          if source.count(message_handler) != 1:
              raise SystemExit("Pinned PakePlus message handler changed")
          source = source.replace(
              message_handler,
              "    func userContentController(_ userContentController: "
              "WKUserContentController, didReceive message: WKScriptMessage) {\n"
              '        if message.name == "completionNotification" {\n'
              "            handleCompletionNotificationMessage(message)\n"
              "            return\n"
              "        }\n"
              '        if message.name == "realtimeAudio" {\n'
              "            handleRealtimeAudioMessage(message)\n"
              "            return\n"
              "        }\n"
              '        guard message.name == "blobDownload" else { return }',
              1,
          )
          download_navigation_anchor = (
              "        // only trigger download when user clicks link, other navigation load normally\n"
              "        if navigationAction.navigationType == .linkActivated, shouldDownload(url: url) {\n"
              "            decisionHandler(.cancel)\n"
              "            downloadFile(from: url)\n"
              "            return\n"
              "        }\n\n"
              "        decisionHandler(.allow)"
          )
          if source.count(download_navigation_anchor) != 1:
              raise SystemExit("Pinned PakePlus HTTP navigation hook changed")
          source = source.replace(
              download_navigation_anchor,
              "        // only trigger download when user clicks link, other navigation load normally\n"
              "        if navigationAction.navigationType == .linkActivated, shouldDownload(url: url) {\n"
              "            decisionHandler(.cancel)\n"
              "            downloadFile(from: url)\n"
              "            return\n"
              "        }\n\n"
              "        if navigationAction.navigationType == .linkActivated,\n"
              "           let scheme = url.scheme?.lowercased(),\n"
              '           scheme == "http" || scheme == "https"\n'
              "        {\n"
              "            decisionHandler(.cancel)\n"
              "            CodexMobileInAppBrowserViewController.present(url: url)\n"
              "            return\n"
              "        }\n\n"
              "        decisionHandler(.allow)",
              1,
          )
          ui_delegate_anchor = "    // MARK: - WKUIDelegate: system vs web permissions\n"
          if source.count(ui_delegate_anchor) != 1:
              raise SystemExit("Pinned PakePlus WKUIDelegate hook changed")
          source = source.replace(
              ui_delegate_anchor,
              "    func webView(\n"
              "        _ webView: WKWebView,\n"
              "        createWebViewWith configuration: WKWebViewConfiguration,\n"
              "        for navigationAction: WKNavigationAction,\n"
              "        windowFeatures: WKWindowFeatures\n"
              "    ) -> WKWebView? {\n"
              "        guard navigationAction.targetFrame == nil,\n"
              "              let url = navigationAction.request.url else { return nil }\n"
              "        if shouldDownload(url: url) {\n"
              "            downloadFile(from: url)\n"
              "            return nil\n"
              "        }\n"
              "        if let scheme = url.scheme?.lowercased(),\n"
              '           scheme == "http" || scheme == "https" {\n'
              "            CodexMobileInAppBrowserViewController.present(url: url)\n"
              "        } else if let scheme = url.scheme?.lowercased(),\n"
              "                  isExternalAppScheme(scheme) {\n"
              "            openExternalURL(url)\n"
              "        }\n"
              "        return nil\n"
              "    }\n\n"
              + ui_delegate_anchor,
              1,
          )
          navigation_finished = "    func webView(_ webView: WKWebView, didFinish navigation: WKNavigation!) {\n"
          if source.count(navigation_finished) != 1:
              raise SystemExit("Pinned PakePlus navigation completion hook changed")
          source = source.replace(
              navigation_finished,
              navigation_finished + "        syncBoldText()\n"
              "        CodexMobileCompletionRouter.attach(webView)\n",
              1,
          )
          source += r'''

          // 冷启动的 URL 先保存，待本地网页加载后再交给已有会话导航。
          enum CodexMobileCompletionRouter {
              private static let pendingKey = "codex-mobile-pending-link"
              private static weak var webView: WKWebView?

              static func open(_ url: URL) {
                  guard let parts = URLComponents(url: url, resolvingAgainstBaseURL: false),
                        parts.scheme == "codexmobile", parts.host == "thread",
                        parts.path.isEmpty || parts.path == "/",
                        parts.user == nil, parts.password == nil,
                        parts.port == nil, parts.fragment == nil else { return }
                  let queries = parts.queryItems ?? []
                  guard queries.count == 2,
                        queries.filter({ $0.name == "backendId" }).count == 1,
                        queries.filter({ $0.name == "threadId" }).count == 1,
                        let backendId = queries.first(where: { $0.name == "backendId" })?.value,
                        let threadId = queries.first(where: { $0.name == "threadId" })?.value,
                        !backendId.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty,
                        !threadId.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty,
                        backendId.count <= 256, threadId.count <= 512 else { return }
                  UserDefaults.standard.set(["backendId": backendId, "threadId": threadId], forKey: pendingKey)
                  deliver()
              }

              static func attach(_ view: WKWebView) {
                  webView = view
                  deliver()
              }

              private static func deliver() {
                  guard let view = webView, !view.isLoading,
                        let target = UserDefaults.standard.dictionary(forKey: pendingKey) as? [String: String],
                        let data = try? JSONSerialization.data(withJSONObject: target),
                        let json = String(data: data, encoding: .utf8) else { return }
                  view.evaluateJavaScript(
                      "window.__codexMobileCompletionTarget=\(json);"
                      + "window.dispatchEvent(new CustomEvent('codex-mobile-open-thread',{detail:\(json)}))"
                  ) { _, error in
                      if error == nil,
                         UserDefaults.standard.dictionary(forKey: pendingKey) as? [String: String] == target {
                          UserDefaults.standard.removeObject(forKey: pendingKey)
                      }
                  }
              }
          }

          // UIKit 可能在布局之后追加几何动画；在主图层入口阻止动画，保持网页与容器尺寸同步。
          // 此图层只用于 WKWebView 本身，网页子图层动画与透明度动画继续正常执行。
          private class CodexMobileWebViewLayer: CALayer {
              override func add(_ animation: CAAnimation, forKey key: String?) {
                  if let property = animation as? CAPropertyAnimation, let path = property.keyPath,
                     path == "position" || path == "bounds" || path.hasPrefix("bounds.") {
                      return
                  }
                  super.add(animation, forKey: key)
              }
          }

          class CodexMobileWebView: WKWebView {
              override class var layerClass: AnyClass { CodexMobileWebViewLayer.self }

