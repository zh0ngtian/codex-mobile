          source += r'''

          private extension Coordinator {
              func handleCompletionNotificationMessage(
                  _ message: WKScriptMessage
              ) {
                  guard let body = message.body as? [String: Any],
                        let action = body["action"] as? String else { return }
                  switch action {
                  case "request":
                      UNUserNotificationCenter.current().requestAuthorization(
                          options: [.alert, .sound]
                      ) { _, _ in }
                  case "show":
                      guard let title = body["title"] as? String,
                            let notificationBody = body["body"] as? String,
                            let backendId = body["backendId"] as? String,
                            let threadId = body["threadId"] as? String else {
                          return
                      }
                      showCompletionNotification(
                          title: title,
                          body: notificationBody,
                          backendId: backendId,
                          threadId: threadId
                      )
                  default:
                      break
                  }
              }

              func showCompletionNotification(
                  title: String,
                  body: String,
                  backendId: String,
                  threadId: String
              ) {
                  let center = UNUserNotificationCenter.current()
                  center.getNotificationSettings { settings in
                      guard settings.authorizationStatus == .authorized
                              || settings.authorizationStatus == .provisional
                              || settings.authorizationStatus == .ephemeral else {
                          return
                      }
                      let content = UNMutableNotificationContent()
                      content.title = String(title.prefix(120))
                      content.body = String(body.prefix(512))
                      content.sound = .default
                      content.threadIdentifier = threadId
                      content.userInfo = [
                          "backendId": backendId,
                          "threadId": threadId,
                      ]
                      center.add(
                          UNNotificationRequest(
                              identifier:
                                  "codex-mobile-run-completed-\(threadId)",
                              content: content,
                              trigger: nil
                          )
                      )
                  }
              }

              func handleRealtimeAudioMessage(_ message: WKScriptMessage) {
                  guard let body = message.body as? [String: Any],
                        let action = body["action"] as? String else { return }
                  switch action {
                  case "start":
                      requestAndStartRealtimeAudio()
                  case "stop":
                      stopRealtimeAudio()
                  case "mute":
                      realtimeAudioMuted = (body["muted"] as? Bool) ?? false
                  default:
                      break
                  }
              }

              func requestAndStartRealtimeAudio() {
                  let session = AVAudioSession.sharedInstance()
                  switch session.recordPermission {
                  case .granted:
                      startRealtimeAudio()
                  case .undetermined:
                      session.requestRecordPermission { [weak self] granted in
                          DispatchQueue.main.async {
                              if granted {
                                  self?.startRealtimeAudio()
                              } else {
                                  self?.emitRealtimeAudio([
                                      "type": "error",
                                      "message": "麦克风权限未授权",
                                  ])
                              }
                          }
                      }
                  case .denied:
                      emitRealtimeAudio([
                          "type": "error",
                          "message": "麦克风权限未授权",
                      ])
                  @unknown default:
                      emitRealtimeAudio([
                          "type": "error",
                          "message": "无法读取麦克风权限状态",
                      ])
                  }
              }

              func startRealtimeAudio() {
                  if realtimeAudioEngine != nil { return }
                  do {
                      let session = AVAudioSession.sharedInstance()
                      try session.setCategory(
                          .playAndRecord,
                          mode: .voiceChat,
                          options: [.defaultToSpeaker, .allowBluetooth]
                      )
                      try session.setActive(true)

                      let engine = AVAudioEngine()
                      let input = engine.inputNode
                      let inputFormat = input.inputFormat(forBus: 0)
                      guard let targetFormat = AVAudioFormat(
                          commonFormat: .pcmFormatInt16,
                          sampleRate: 24_000,
                          channels: 1,
                          interleaved: true
                      ), let converter = AVAudioConverter(
                          from: inputFormat,
                          to: targetFormat
                      ) else {
                          throw NSError(
                              domain: "CodexMobileRealtimeAudio",
                              code: 1,
                              userInfo: [
                                  NSLocalizedDescriptionKey:
                                      "无法创建麦克风音频转换器"
                              ]
                          )
                      }
                      realtimeAudioEngine = engine
                      realtimeAudioConverter = converter
                      realtimeAudioMuted = false
                      input.installTap(
                          onBus: 0,
                          bufferSize: 2_400,
                          format: inputFormat
                      ) { [weak self] buffer, _ in
                          self?.convertAndEmitRealtimeAudio(
                              buffer,
                              targetFormat: targetFormat
                          )
                      }
                      engine.prepare()
                      try engine.start()
                      emitRealtimeAudio(["type": "started"])
                  } catch {
                      stopRealtimeAudio()
                      emitRealtimeAudio([
                          "type": "error",
                          "message": error.localizedDescription,
                      ])
                  }
              }

              func convertAndEmitRealtimeAudio(
                  _ input: AVAudioPCMBuffer,
                  targetFormat: AVAudioFormat
              ) {
                  guard !realtimeAudioMuted,
                        let converter = realtimeAudioConverter else { return }
                  let ratio = targetFormat.sampleRate / input.format.sampleRate
                  let capacity = AVAudioFrameCount(
                      ceil(Double(input.frameLength) * ratio) + 32
                  )
                  guard let output = AVAudioPCMBuffer(
                      pcmFormat: targetFormat,
                      frameCapacity: capacity
                  ) else { return }
                  var supplied = false
                  var conversionError: NSError?
                  let status = converter.convert(
                      to: output,
                      error: &conversionError
                  ) { _, outputStatus in
                      if supplied {
                          outputStatus.pointee = .noDataNow
                          return nil
                      }
                      supplied = true
                      outputStatus.pointee = .haveData
                      return input
                  }
                  guard status != .error,
                        output.frameLength > 0,
                        let samples = output.int16ChannelData?[0] else {
                      return
                  }
                  let data = Data(
                      bytes: samples,
                      count: Int(output.frameLength) * MemoryLayout<Int16>.size
                  )
                  emitRealtimeAudio([
                      "type": "chunk",
                      "data": data.base64EncodedString(),
                      "sampleRate": 24_000,
                      "numChannels": 1,
                      "samplesPerChannel": Int(output.frameLength),
                  ])
              }

              func stopRealtimeAudio() {
                  guard let engine = realtimeAudioEngine else { return }
                  engine.inputNode.removeTap(onBus: 0)
                  engine.stop()
                  realtimeAudioEngine = nil
                  realtimeAudioConverter = nil
                  try? AVAudioSession.sharedInstance().setActive(
                      false,
                      options: .notifyOthersOnDeactivation
                  )
                  emitRealtimeAudio(["type": "stopped"])
              }

              func emitRealtimeAudio(_ detail: [String: Any]) {
                  guard JSONSerialization.isValidJSONObject(detail),
                        let data = try? JSONSerialization.data(
                            withJSONObject: detail
                        ),
                        let json = String(data: data, encoding: .utf8) else {
                      return
                  }
                  DispatchQueue.main.async { [weak self] in
                      self?.realtimeWebView?.evaluateJavaScript(
                          "window.dispatchEvent(new CustomEvent("
                          + "'codex-mobile-realtime-audio',"
                          + "{detail:\(json)}))"
                      )
                  }
              }
          }

          extension Coordinator {
              func userNotificationCenter(
                  _ center: UNUserNotificationCenter,
                  didReceive response: UNNotificationResponse,
                  withCompletionHandler completionHandler: @escaping () -> Void
              ) {
                  defer { completionHandler() }
                  let userInfo = response.notification.request.content.userInfo
                  guard let backendId = userInfo["backendId"] as? String,
                        let threadId = userInfo["threadId"] as? String,
                        !backendId.isEmpty,
                        !threadId.isEmpty,
                        let data = try? JSONSerialization.data(
                            withJSONObject: [
                                "backendId": backendId,
                                "threadId": threadId,
                            ]
                        ),
                        let json = String(data: data, encoding: .utf8) else {
                      return
                  }
                  DispatchQueue.main.async { [weak self] in
                      self?.realtimeWebView?.evaluateJavaScript(
                          "window.__codexMobileCompletionTarget=\(json);"
                          + "window.dispatchEvent(new CustomEvent("
                          + "'codex-mobile-open-thread',"
                          + "{detail:\(json)}))"
                      )
                  }
              }

              func userNotificationCenter(
                  _ center: UNUserNotificationCenter,
                  willPresent notification: UNNotification,
                  withCompletionHandler completionHandler:
                      @escaping (UNNotificationPresentationOptions) -> Void
              ) {
                  completionHandler([.banner, .sound])
              }
          }
          '''.replace("\n          ", "\n")
          geolocation_prompt = "        context.coordinator.prepareWebGeolocationAuthorization()\n"
