name: Development Checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: development-checks-${{ github.event.pull_request.number || github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_OPTIONS: --no-experimental-webstorage

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: 安装锁定依赖
        run: npm ci
      - name: 验证消息展示与多语言回归
        run: npm test -- tests/native-ui/agentapp-message-presentation.test.ts tests/ui/i18n.test.tsx --maxWorkers=2 --testTimeout=60000
      - name: 运行完整 Vitest
        run: npm test -- --maxWorkers=2 --testTimeout=60000
      - name: 验证类型
        run: npm run typecheck
      - name: 运行开发与构建契约测试
        run: npm test -- tests/ci --maxWorkers=2 --testTimeout=60000
      - name: 验证 Web 构建
        run: npm run build
