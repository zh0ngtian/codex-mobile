name: Build Mobile Apps

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'mobile/**'
      - 'package.json'
      - 'package-lock.json'
      - 'mobile-version-floor.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'docs/assets/app-icon/codex-mobile-app-icon-1024.png'
      - 'scripts/prepare-ios.mjs'
      - 'scripts/build-mobile.mjs'
      - 'scripts/resolve-mobile-version.mjs'
      - '.github/workflows/build-mobile.yml'
  workflow_dispatch:
    inputs:
      release_version:
        description: '可选：高于已发布版本的统一 major.minor.patch 版本'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_OPTIONS: --no-experimental-webstorage

jobs:
  version:
    name: Resolve shared version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: 分配双端统一版本
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq '[.[][] | .tag_name]' > "$RUNNER_TEMP/releases.json"
          args=(--releases "$RUNNER_TEMP/releases.json")
          if [[ -n "$REQUESTED_VERSION" ]]; then args+=(--requested "$REQUESTED_VERSION"); fi
          node scripts/resolve-mobile-version.mjs "${args[@]}"

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-15-intel
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.6"
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: ''
      - uses: maxim-lobanov/setup-xcode@v1
        if: matrix.platform == 'ios'
        with:
          xcode-version: '26.3'
      - name: 安装锁定依赖
        run: npm ci
      - name: 验证构建契约
        run: npm test -- tests/ci --maxWorkers=2 --testTimeout=60000
      - name: 编译并校验安装包
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: node scripts/build-mobile.mjs --platform "$BUILD_PLATFORM" --version "$APP_VERSION"
      - name: 保存已校验产物
        uses: actions/upload-artifact@v4
        with:
          name: codex-mobile-${{ matrix.platform }}
          path: .mobile-build/artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish dual-platform release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: codex-mobile-*
          merge-multiple: true
          path: artifacts
      - name: 校验并发布双端 Release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.version.outputs.app_version }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          test -s "CodexMobile-v${APP_VERSION}.apk"
          test -s "CodexMobile-v${APP_VERSION}-unsigned.ipa"
          sha256sum --check ./*.sha256
          cat > release-notes.md <<'NOTES'
          Android APK 与 iOS unsigned IPA 使用同一版本，由当前提交与固定 PakePlus 容器构建。
          IPA 未签名，安装前需自行签名；本机 Ad Hoc 签名、OTA、固定 LAN 渠道与软件源发布仍按仓库现役流程执行。
          附件包含安装包、SHA-256 校验文件和构建回执（来源提交、版本、文件大小及散列）。
          NOTES
          gh release create "$RELEASE_TAG" ./*.apk ./*.ipa ./*.sha256 ./*-build.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Codex Mobile ${APP_VERSION}" --notes-file release-notes.md
