name: Build Mobile Apps

on:
  push:
    branches: [main]
    paths: ['.release-batch.json']
  workflow_dispatch:
    inputs:
      batch_id:
        description: '协调器冻结的 batchId'
        required: true
        type: string
      frozen_sha:
        description: '引入冻结 manifest 的完整提交 SHA'
        required: true
        type: string
      release_version:
        description: '与冻结 manifest 一致的统一版本'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codex-mobile-main-production
  queue: max
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_OPTIONS: --no-experimental-webstorage

jobs:
  version:
    name: Validate frozen batch
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_required: ${{ steps.version.outputs.release_required }}
      batch_id: ${{ steps.version.outputs.batch_id }}
      source_commit: ${{ steps.version.outputs.source_commit }}
      app_version_code: ${{ steps.version.outputs.app_version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: 校验冻结批次与完整提交来源
        id: version
        env:
          REQUESTED_BATCH_ID: ${{ inputs.batch_id }}
          REQUESTED_FROZEN_SHA: ${{ inputs.frozen_sha }}
          REQUESTED_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test -n "$REQUESTED_BATCH_ID" && test -n "$REQUESTED_FROZEN_SHA" && test -n "$REQUESTED_VERSION"
            args+=(--batch-id "$REQUESTED_BATCH_ID" --frozen-sha "$REQUESTED_FROZEN_SHA" --version "$REQUESTED_VERSION")
          fi
          node scripts/validate-release-batch.mjs "${args[@]}"

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    if: needs.version.outputs.release_required == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-15-intel
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
      BATCH_ID: ${{ needs.version.outputs.batch_id }}
      SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - uses: pnpm/action-setup@v4
        with:
          version: "10.34.6"
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: ''
      - uses: maxim-lobanov/setup-xcode@v1
        if: matrix.platform == 'ios'
        with:
          xcode-version: '26.3'
      - name: 再次校验冻结来源
        run: node scripts/validate-release-batch.mjs --batch-id "$BATCH_ID" --frozen-sha "$SOURCE_COMMIT" --version "$APP_VERSION"
      - name: 安装锁定依赖
        run: npm ci --ignore-scripts
      - name: 验证构建契约
        run: npm test -- tests/ci --maxWorkers=2 --testTimeout=60000
      - name: 编译并校验安装包
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: node scripts/build-mobile.mjs --platform "$BUILD_PLATFORM" --version "$APP_VERSION" --batch-id "$BATCH_ID" --frozen-sha "$SOURCE_COMMIT"
      - name: 保存已校验产物
        uses: actions/upload-artifact@v4
        with:
          name: codex-mobile-${{ matrix.platform }}
          path: .mobile-build/artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish dual-platform release
    needs: [version, build]
    if: needs.version.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: codex-mobile-*
          merge-multiple: true
          path: artifacts
      - name: 校验并发布双端 Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ needs.version.outputs.app_version }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          BATCH_ID: ${{ needs.version.outputs.batch_id }}
          SOURCE_COMMIT: ${{ needs.version.outputs.source_commit }}
        run: |
          set -euo pipefail
          # checkout 完整历史后，再核对当前远端 tag，包含 annotated tag 的真实 commit。
          gh auth setup-git
          remote_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")"
          if [[ -n "$remote_tag" ]]; then
            git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          fi
          node scripts/validate-release-batch.mjs --batch-id "$BATCH_ID" --frozen-sha "$SOURCE_COMMIT" --version "$APP_VERSION" \
            --receipts artifacts --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          cd artifacts
          test -s "CodexMobile-v${APP_VERSION}.apk"
          test -s "CodexMobile-v${APP_VERSION}-unsigned.ipa"
          sha256sum --check ./*.sha256
          cat > release-notes.md <<'NOTES'
          Android APK 与 iOS unsigned IPA 使用同一版本，由当前提交与固定 PakePlus 容器构建。
          IPA 未签名，安装前需自行签名；本机 Ad Hoc 签名、OTA、固定 LAN 渠道与软件源发布仍按仓库现役流程执行。
          附件包含安装包、SHA-256 校验文件和构建回执（来源提交、版本、文件大小及散列）。
          NOTES
          gh release create "$RELEASE_TAG" ./*.apk ./*.ipa ./*.sha256 ./*-build.json \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" \
            --title "Codex Mobile ${APP_VERSION}" --notes-file release-notes.md
          cd ..
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$SOURCE_COMMIT"
