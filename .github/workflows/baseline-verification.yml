name: Baseline Test Verification
on:
  push:
    branches: ['verify/baseline-tests-20261022']
permissions:
  contents: read
env:
  NODE_OPTIONS: --no-experimental-webstorage
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        revision: ['d5fd098f438e79a55d0a95459e97e0323437f580', '9ac468a0f3307b5571715545d586784449a5a612']
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - name: 对比额外失败用例
        run: npm test -- tests/ui/native-ui-sidechat.test.tsx tests/ui/native-ui-switch-app.test.tsx tests/server/bark-notifications.test.ts --maxWorkers=2 --testTimeout=60000
